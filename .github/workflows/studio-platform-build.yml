name: Studio Platform Build

on:
  push:
    branches:
      - 'dev/studio-platform'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Studio (platform mode, GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          build-args: |
            STUDIO_FRAMEWORK=next
            NEXT_PUBLIC_IS_PLATFORM=true
            NEXT_PUBLIC_API_URL=http://47.98.247.190:3000/platform
            NEXT_PUBLIC_ENVIRONMENT=production
          tags: supabase/studio:2026.09.27-dev-platform
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save & compress image to zip
        run: |
          docker image inspect supabase/studio:2026.09.27-dev-platform >/dev/null 2>&1 || { echo "镜像不存在，终止"; exit 1; }
          docker save supabase/studio:2026.09.27-dev-platform | gzip > studio-image.tar.gz
          ls -lh studio-image.tar.gz

      - name: Transfer image to control plane (hermes-hz)
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 studio-image.tar.gz root@47.98.247.190:/opt/studio-images/

      - name: Load image on hermes-hz
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@47.98.247.190 \
            "docker load -i /opt/studio-images/studio-image.tar.gz && docker images | grep '2026.09.27-dev-platform'"

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push image (custom tag)
        if: env.DOCKER_USERNAME != ''
        run: |
          docker push supabase/studio:2026.09.27-dev-platform
          echo "Pushed supabase/studio:2026.09.27-dev-platform"
