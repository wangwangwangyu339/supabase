name: Studio Platform Build

on:
  push:
    branches:
      - 'dev/studio-platform'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Studio (platform mode, custom tag)
        run: |
          docker build . -f apps/studio/Dockerfile --target production \
            --build-arg STUDIO_FRAMEWORK=next \
            --build-arg NEXT_PUBLIC_IS_PLATFORM=true \
            --build-arg NEXT_PUBLIC_API_URL=http://47.98.247.190:3000/platform \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=production \
            -t supabase/studio:2026.09.27-dev-platform

      - name: Save & compress image to zip
        run: |
          docker save supabase/studio:2026.09.27-dev-platform | gzip > studio-image.tar.gz
          ls -lh studio-image.tar.gz

      - name: Transfer image to control plane (hermes-hz)
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 studio-image.tar.gz root@47.98.247.190:/opt/studio-images/

      - name: Load image on hermes-hz
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@47.98.247.190 \
            "docker load -i /opt/studio-images/studio-image.tar.gz && docker images | grep '2026.09.27-dev-platform'"

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push image (custom tag)
        if: env.DOCKER_USERNAME != ''
        run: |
          docker push supabase/studio:2026.09.27-dev-platform
          echo "Pushed supabase/studio:2026.09.27-dev-platform"
